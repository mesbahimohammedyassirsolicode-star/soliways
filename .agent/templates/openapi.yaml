openapi: 3.0.3
info:
  title: "[Project Name] API"
  version: "1.0.0"
servers:
  - url: http://localhost:8000/api/v1
security:
  - sanctum: []
paths:
  /examples:
    get:
      summary: List examples (paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExampleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Example:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Sample" }
    ExampleList:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Example" } }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
    Error:
      type: object
      properties:
        message: { type: string, example: "Unauthenticated." }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
