<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThemeCard — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#25A6AC', glow: 'rgba(37, 166, 172, 0.4)' },
            secondary: { DEFAULT: '#456BB8' },
            dark: { DEFAULT: '#101828', surface: '#162036', card: '#1A2640', border: '#22314E' }
          },
          fontFamily: { sans: ['Manrope', 'sans-serif'], heading: ['Inter', 'sans-serif'] },
          boxShadow: {
            'glow-primary': '0 0 25px -5px rgba(37, 166, 172, 0.45)',
            'card-dark': '0 20px 40px -15px rgba(0, 0, 0, 0.6)'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b101c] text-white p-8 font-sans flex items-center justify-center min-h-screen">

  <div class="max-w-md w-full">
    <!-- Theme Card Component -->
    <div class="relative bg-gradient-to-b from-dark-surface to-dark border border-dark-border rounded-3xl p-6 sm:p-8 space-y-5 hover:border-primary/50 transition-all duration-300 group shadow-card-dark hover:-translate-y-1">
      
      <!-- Top Icon & Badge -->
      <div class="flex items-center justify-between">
        <div class="w-12 h-12 rounded-2xl bg-primary/10 border border-primary/20 flex items-center justify-center text-primary group-hover:scale-110 group-hover:shadow-glow-primary transition duration-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        </div>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-primary/10 text-primary border border-primary/20">
          Thématique 01
        </span>
      </div>

      <!-- Title & Content -->
      <div class="space-y-2">
        <h3 class="font-heading text-xl font-bold text-white group-hover:text-primary transition duration-200">
          Développement web
        </h3>
        <p class="text-slate-400 text-sm leading-relaxed">
          Découvrez la création de sites et d’applications web modernes et explorez l'ensemble des possibilités offertes par le développement numérique.
        </p>
      </div>

      <!-- Action Footer -->
      <div class="pt-2 flex items-center text-xs font-semibold text-primary gap-1.5">
        <span>Ateliers & Découverte</span>
        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </div>

    </div>
  </div>

</body>
</html>
