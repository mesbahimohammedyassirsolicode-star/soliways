<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaqAccordionItem — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#25A6AC' },
            dark: { DEFAULT: '#101828', surface: '#162036', card: '#1A2640', border: '#22314E' }
          },
          fontFamily: { sans: ['Manrope', 'sans-serif'], heading: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>[x-cloak]{display:none !important}</style>
</head>
<body class="bg-[#0b101c] text-white p-8 font-sans flex items-center justify-center min-h-screen">

  <div class="max-w-xl w-full space-y-4">
    <span class="text-xs font-mono text-primary uppercase tracking-wider block">Molecule: FaqAccordionItem</span>

    <!-- FAQ Accordion Item -->
    <div class="bg-dark-surface border border-dark-border rounded-2xl overflow-hidden transition"
         x-data="{ open: false }">
      <button @click="open = !open"
              class="w-full p-5 text-left flex items-center justify-between gap-4 font-heading font-semibold text-white hover:text-primary transition">
        <span>Où et quand se déroule l'événement SOLIWAY 2027 ?</span>
        <svg class="w-5 h-5 text-primary transform transition-transform duration-300 flex-shrink-0"
             :class="open ? 'rotate-180' : ''"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <div x-cloak x-show="open" x-collapse
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-2"
           x-transition:enter-end="opacity-100 translate-y-0"
           class="px-5 pb-5 text-sm text-slate-400 leading-relaxed border-t border-dark-border/50 pt-3">
        L'événement se tiendra du 13 au 16 avril 2027 au sein des locaux de SOLICODE à Tanger, Maroc. L'accès est ouvert au grand public, aux étudiants et aux professionnels de l'IT.
      </div>
    </div>
  </div>

</body>
</html>
