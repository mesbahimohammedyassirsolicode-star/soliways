<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PillarCard — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#25A6AC', glow: 'rgba(37, 166, 172, 0.4)' },
            secondary: { DEFAULT: '#456BB8' },
            dark: { DEFAULT: '#101828', surface: '#162036', border: '#22314E' }
          },
          fontFamily: { sans: ['Manrope', 'sans-serif'], heading: ['Inter', 'sans-serif'] },
          boxShadow: { 'card-light': '0 10px 25px -5px rgba(16, 24, 40, 0.05)' }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b101c] text-white p-8 font-sans flex items-center justify-center min-h-screen">

  <div class="max-w-md w-full">
    <!-- Pillar Card Component -->
    <div class="bg-dark-surface border border-dark-border rounded-3xl p-6 sm:p-8 space-y-4 hover:border-primary/40 transition duration-300 group">
      <div class="w-12 h-12 rounded-2xl bg-primary/10 border border-primary/20 flex items-center justify-center text-primary group-hover:scale-110 transition duration-300">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      </div>
      
      <span class="inline-block text-xs font-bold uppercase tracking-widest text-primary">Pilier 01</span>
      
      <h3 class="font-heading text-xl font-bold text-white group-hover:text-primary transition duration-200">
        Apprendre
      </h3>
      
      <p class="text-slate-400 text-sm leading-relaxed">
        Explorer de nouvelles notions et des domaines variés de l’IT à travers des sessions interactives animées par des passionnés.
      </p>
    </div>
  </div>

</body>
</html>
