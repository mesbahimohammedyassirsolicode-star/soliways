<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#25A6AC', glow: 'rgba(37, 166, 172, 0.2)' },
            dark: { DEFAULT: '#101828', surface: '#162036', border: '#22314E' }
          },
          fontFamily: { sans: ['Manrope', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b101c] text-white p-8 font-sans flex items-center justify-center min-h-screen">

  <div class="max-w-md w-full bg-dark-surface border border-dark-border rounded-3xl p-8 space-y-6">
    <div class="border-b border-dark-border pb-4">
      <span class="text-xs font-mono text-primary uppercase tracking-wider">Atom: Input</span>
      <h2 class="text-xl font-bold text-white">Champs de Formulaire</h2>
    </div>

    <!-- Default Input -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-300">Votre adresse email</label>
      <input type="email" placeholder="nom@exemple.com" class="w-full bg-dark border border-dark-border rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
    </div>

    <!-- Error State -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-300">Email invalide</label>
      <input type="email" value="invalide-email@" class="w-full bg-dark border border-rose-500/60 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-rose-500/20 transition">
      <p class="text-xs text-rose-400">Veuillez renseigner un email valide.</p>
    </div>
  </div>

</body>
</html>
