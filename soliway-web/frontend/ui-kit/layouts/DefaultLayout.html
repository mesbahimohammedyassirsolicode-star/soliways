<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DefaultLayout — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#25A6AC', hover: '#1E878C', glow: 'rgba(37, 166, 172, 0.4)' },
            secondary: { DEFAULT: '#456BB8', hover: '#365696' },
            accent: { DEFAULT: '#6554B8', hover: '#52429C' },
            dark: { DEFAULT: '#101828', surface: '#162036', card: '#1A2640', border: '#22314E' },
            surface: { light: '#FFFFFF', muted: '#F5F8FC' }
          },
          fontFamily: { sans: ['Manrope', 'sans-serif'], heading: ['Inter', 'sans-serif'] },
          boxShadow: {
            'glow-primary': '0 0 25px -5px rgba(37, 166, 172, 0.45)',
            'card-dark': '0 20px 40px -15px rgba(0, 0, 0, 0.6)'
          }
        }
      }
    }
  </script>
  <style>[x-cloak]{display:none !important}</style>
</head>
<body class="bg-[#0b101c] text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-primary selection:text-white"
      x-data="{ showScrollTop: false }"
      @scroll.window="showScrollTop = (window.pageYOffset > 400)">

  <!-- Layout Header Slot -->
  <header class="border-b border-dark-border bg-dark/90 backdrop-blur sticky top-0 z-40 py-4 px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="../assets/img/logo-nav-dark.png" alt="Soliways Logo" class="h-9 w-auto">
      </div>
      <div class="text-xs text-slate-400 font-mono">[Header / Navbar Component Slot]</div>
    </div>
  </header>

  <!-- Layout Main Content Slot -->
  <main class="flex-grow">
    <div class="max-w-7xl mx-auto px-6 py-16">
      <div class="border-2 border-dashed border-dark-border rounded-3xl p-12 text-center space-y-4 bg-dark-surface/50">
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-primary/10 text-primary border border-primary/20">Slot Content</span>
        <h1 class="text-3xl font-heading font-extrabold text-white">Page Content Shell</h1>
        <p class="text-slate-400 max-w-xl mx-auto">This layout manages page structure, SEO head metadata, font rendering, smooth scrolling landmarks, and back-to-top interaction.</p>
      </div>
    </div>
  </main>

  <!-- Layout Footer Slot -->
  <footer class="border-t border-dark-border bg-dark py-8 px-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <span>© 2027 SOLIWAYS — Équipe SOLICODE Tanger.</span>
      <span class="text-slate-400 font-mono">[Footer Component Slot]</span>
    </div>
  </footer>

  <!-- Back to Top Floating Button -->
  <button x-cloak x-show="showScrollTop"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 translate-y-4"
          x-transition:enter-end="opacity-100 translate-y-0"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="opacity-100 translate-y-0"
          x-transition:leave-end="opacity-0 translate-y-4"
          @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
          class="fixed bottom-6 right-6 z-50 p-3 rounded-full bg-primary text-white shadow-glow-primary hover:bg-primary-hover active:scale-95 transition"
          aria-label="Remonter en haut">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
  </button>

</body>
</html>
