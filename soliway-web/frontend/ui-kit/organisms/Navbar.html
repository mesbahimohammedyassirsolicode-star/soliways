<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#25A6AC', hover: '#1E878C', glow: 'rgba(37, 166, 172, 0.4)' },
            secondary: { DEFAULT: '#456BB8', hover: '#365696' },
            accent: { DEFAULT: '#6554B8' },
            dark: { DEFAULT: '#101828', surface: '#162036', card: '#1A2640', border: '#22314E' }
          },
          fontFamily: { sans: ['Manrope', 'sans-serif'], heading: ['Inter', 'sans-serif'] },
          boxShadow: { 'glow-primary': '0 0 25px -5px rgba(37, 166, 172, 0.45)' }
        }
      }
    }
  </script>
  <style>[x-cloak]{display:none !important}</style>
</head>
<body class="bg-[#0b101c] text-white font-sans antialiased">

  <!-- Navbar Component with Official SOLIWAYS Logo & Alpine.js Mobile Drawer -->
  <nav x-data="{ mobileOpen: false, scrolled: false }"
       @scroll.window="scrolled = (window.pageYOffset > 20)"
       :class="scrolled ? 'bg-dark/95 border-b border-dark-border shadow-2xl backdrop-blur-md' : 'bg-transparent border-b border-white/5'"
       class="sticky top-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 sm:px-12 h-20 flex items-center justify-between">
      
      <!-- Official Logo Brand -->
      <a href="#accueil" class="flex items-center gap-3 group">
        <img src="../assets/img/logo-nav-dark.png" alt="Soliways Logo" class="h-10 w-auto group-hover:scale-105 transition duration-300 drop-shadow-[0_0_12px_rgba(37,166,172,0.4)]">
      </a>

      <!-- Desktop Navigation Links -->
      <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
        <a href="#accueil" class="hover:text-primary transition duration-200">Accueil</a>
        <a href="#a-propos" class="hover:text-primary transition duration-200">À propos</a>
        <a href="#programme" class="hover:text-primary transition duration-200">Programme</a>
        <a href="#thematiques" class="hover:text-primary transition duration-200">Thématiques</a>
        <a href="#equipe" class="hover:text-primary transition duration-200">Équipe</a>
        <a href="#pratique" class="hover:text-primary transition duration-200">Infos pratiques</a>
      </div>

      <!-- Action Button & Mobile Toggle -->
      <div class="flex items-center gap-4">
        <a href="#inscriptions" class="hidden sm:inline-flex items-center gap-2 px-5 py-2.5 rounded-xl font-heading font-semibold text-xs text-white bg-primary hover:bg-primary-hover active:scale-[0.98] transition shadow-glow-primary">
          <span>Inscriptions bientôt</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </a>

        <!-- Mobile Hamburger Button -->
        <button @click="mobileOpen = !mobileOpen"
                class="md:hidden p-2 rounded-xl bg-dark-surface border border-dark-border text-slate-300 hover:text-white"
                aria-label="Menu principal">
          <svg x-show="!mobileOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          <svg x-cloak x-show="mobileOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

    </div>

    <!-- Mobile Slide-over Drawer -->
    <div x-cloak x-show="mobileOpen"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-4"
         class="md:hidden border-b border-dark-border bg-dark/98 backdrop-blur-xl px-6 py-6 space-y-4 shadow-2xl">
      <div class="flex flex-col space-y-3 text-base font-medium">
        <a @click="mobileOpen = false" href="#accueil" class="px-3 py-2 rounded-lg hover:bg-dark-surface text-slate-200 hover:text-primary">Accueil</a>
        <a @click="mobileOpen = false" href="#a-propos" class="px-3 py-2 rounded-lg hover:bg-dark-surface text-slate-200 hover:text-primary">À propos</a>
        <a @click="mobileOpen = false" href="#programme" class="px-3 py-2 rounded-lg hover:bg-dark-surface text-slate-200 hover:text-primary">Programme</a>
        <a @click="mobileOpen = false" href="#thematiques" class="px-3 py-2 rounded-lg hover:bg-dark-surface text-slate-200 hover:text-primary">Thématiques</a>
        <a @click="mobileOpen = false" href="#equipe" class="px-3 py-2 rounded-lg hover:bg-dark-surface text-slate-200 hover:text-primary">Équipe</a>
        <a @click="mobileOpen = false" href="#pratique" class="px-3 py-2 rounded-lg hover:bg-dark-surface text-slate-200 hover:text-primary">Infos pratiques</a>
      </div>
      <div class="pt-2 border-t border-dark-border">
        <a @click="mobileOpen = false" href="#inscriptions" class="w-full flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-heading font-semibold text-sm text-white bg-primary hover:bg-primary-hover shadow-glow-primary">
          <span>Inscriptions bientôt disponibles</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="p-12 text-center text-slate-500 text-xs">
    [Navbar preview with adapted official SOLIWAYS logo]
  </div>

</body>
</html>
